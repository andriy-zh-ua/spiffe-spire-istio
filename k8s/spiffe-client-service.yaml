apiVersion: v1
kind: Service
metadata:
  name: spiffe-client
  namespace: spiffe-client-ns
  labels:
    app: spiffe-client
spec:
  type: ClusterIP
  ports:
  - port: 8443
    targetPort: 8443
    protocol: TCP
    name: https
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
  selector:
    app: spiffe-client
